# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      # Linter (matches GitLab CI: ruff check --ignore F401,F841,E722)
      - id: ruff
        args: [--ignore, "F401,F841,E722"]

      # Optional: Auto-formatter (uncomment if you want auto-formatting)
      # - id: ruff-format
