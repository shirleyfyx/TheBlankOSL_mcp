stages:
  - check
  - build

variables:
  COMPOSE_VERSION: "v2.29.1"

# ---------------------------------------------------------------------------
# Stage 1: Sanity Check
# ---------------------------------------------------------------------------
lint_code:
  stage: check
  script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install ruff
    - ruff check --ignore F401,F841,E722 .

# ---------------------------------------------------------------------------
# Stage 2: Build and Push
# ---------------------------------------------------------------------------
build_push_docker:
  stage: build
  # Shell runners ignore this image, but we keep it for documentation
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  
  before_script:
    # 1. Setup a clean, isolated Docker Config for this specific job
    - mkdir -p $CI_PROJECT_DIR/.docker-ci/cli-plugins
    - export DOCKER_CONFIG=$CI_PROJECT_DIR/.docker-ci

    # 2. Check if 'docker compose' works. If not, download it DIRECTLY to the job folder.
    #    (We do NOT touch ~/.docker to avoid the macOS file errors you saw)
    - |
      if docker compose version >/dev/null 2>&1; then
        echo "Docker Compose detected on host. Using system version."
        # Even if system has it, we symlink it to our local config to be safe
        # (Optional, but ensures DOCKER_CONFIG sees it)
      else
        echo "Downloading Docker Compose $COMPOSE_VERSION..."
        
        # Download directly to the local job config
        PLUGIN_PATH=$DOCKER_CONFIG/cli-plugins/docker-compose
        URL="https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64"
        
        # Check if we are on Mac (Darwin) to download the correct binary
        if [[ "$(uname)" == "Darwin" ]]; then
           URL="https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-darwin-aarch64"
        fi

        if command -v curl >/dev/null 2>&1; then
          curl -SL $URL -o $PLUGIN_PATH
        else
          wget -O $PLUGIN_PATH $URL
        fi
        
        chmod +x $PLUGIN_PATH
      fi

    # 3. Login (config.json will be written to $DOCKER_CONFIG)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

  script:
    - echo "Building Docker image..."
    - export IMAGE_NAME=$IMAGE_NAME
    - export IMAGE_TAG=$IMAGE_TAG
    
    # Verify we can see the command
    - docker compose version
    
    - docker compose build
    - docker compose push
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"