stages:
  - check
  - build

# ---------------------------------------------------------------------------
# Stage 1: Sanity Check
# ---------------------------------------------------------------------------
lint_code:
  stage: check
  script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install ruff
    - ruff check --ignore F401,F841,E722 .

# ---------------------------------------------------------------------------
# Stage 2: Build and Push (The "Clean" Way)
# ---------------------------------------------------------------------------
build_push_docker:
  stage: build
  # We use the docker image here, but since it's a shell runner, 
  # we will manually invoke the container in the script below.
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  
  before_script:
    # 1. Login to Registry on the HOST (standard practice)
    #    We set a custom config path so we can easily share it with the container later.
    - mkdir -p $CI_PROJECT_DIR/.docker-ci
    - export DOCKER_CONFIG=$CI_PROJECT_DIR/.docker-ci
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

  script:
    - echo "Building Docker image using containerized toolchain..."
    
    # -----------------------------------------------------------------------
    # THE GOOD PRACTICE SOLUTION
    # We run the build commands INSIDE an ephemeral 'docker:cli' container.
    # This guarantees the 'docker compose' command exists and is the correct version.
    # -----------------------------------------------------------------------
    
    # 1. Build
    - docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$CI_PROJECT_DIR":"$CI_PROJECT_DIR" \
        -v "$DOCKER_CONFIG":/root/.docker \
        -w "$CI_PROJECT_DIR" \
        -e IMAGE_NAME=$IMAGE_NAME \
        -e IMAGE_TAG=$IMAGE_TAG \
        docker:cli compose build
    
    # 2. Push
    # We mount the DOCKER_CONFIG so the container has permission to push
    - docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v "$CI_PROJECT_DIR":"$CI_PROJECT_DIR" \
        -v "$DOCKER_CONFIG":/root/.docker \
        -w "$CI_PROJECT_DIR" \
        -e IMAGE_NAME=$IMAGE_NAME \
        -e IMAGE_TAG=$IMAGE_TAG \
        docker:cli compose push

  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"