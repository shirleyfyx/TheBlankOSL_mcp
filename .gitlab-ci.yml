stages:
  - check
  - build

variables:
  # Pin the version for stability (Robustness factor: High)
  COMPOSE_VERSION: "v2.29.1"

# ---------------------------------------------------------------------------
# Stage 1: Sanity Check
# ---------------------------------------------------------------------------
lint_code:
  stage: check
  script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install ruff
    - ruff check --ignore F401,F841,E722 .

# ---------------------------------------------------------------------------
# Stage 2: Build and Push Docker Image
# ---------------------------------------------------------------------------
build_push_docker:
  stage: build
  # We still request this image, but the script below ensures it works
  # even if the runner ignores this image (Shell Executor fallback).
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  
  before_script:
    # -----------------------------------------------------------------------
    # ROBUST INSTALLATION STRATEGY
    # -----------------------------------------------------------------------
    # 1. Set up the plugin directory in user space (no sudo needed)
    - mkdir -p ~/.docker/cli-plugins

    # 2. Install Docker Compose ONLY if it's missing
    - |
      if docker compose version >/dev/null 2>&1; then
        echo "Docker Compose detected. Skipping install."
      else
        echo "Docker Compose not found. Installing version $COMPOSE_VERSION..."
        
        # Define download URL
        URL="https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-x86_64"
        DEST=~/.docker/cli-plugins/docker-compose
        
        # Try curl, fallback to wget (Covers 99% of Linux systems)
        if command -v curl >/dev/null 2>&1; then
          curl -SL $URL -o $DEST
        else
          wget -O $DEST $URL
        fi
        
        # Make executable
        chmod +x $DEST
      fi

    # 3. Standard Login
    - mkdir -p $CI_PROJECT_DIR/.docker-ci
    - export DOCKER_CONFIG=$CI_PROJECT_DIR/.docker-ci
    # Copy the plugin we just downloaded into the specific config dir we just made
    - cp -r ~/.docker/cli-plugins $DOCKER_CONFIG/cli-plugins
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

  script:
    - echo "Building Docker image with Compose..."
    - export IMAGE_NAME=$IMAGE_NAME
    - export IMAGE_TAG=$IMAGE_TAG
    
    # Verify version before running
    - docker compose version
    
    - docker compose build
    - docker compose push
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"