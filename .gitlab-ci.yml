stages:
  - check
  - build

# ---------------------------------------------------------------------------
# Stage 1: Linting
# ---------------------------------------------------------------------------
lint_code:
  stage: check
  script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install ruff && ruff check --ignore F401,F841,E722 .

# ---------------------------------------------------------------------------
# Stage 2: Build & Push
# ---------------------------------------------------------------------------
build_push:
  stage: build
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    COMPOSE_VER: "v2.29.1"

  before_script:
    # 1. Download Docker Compose to a local folder (Clean & Isolated)
    - mkdir -p .local/bin
    - |
      # Simple detection for Mac (arm64/x86_64) vs Linux
      OS=$(uname -s | tr '[:upper:]' '[:lower:]')
      ARCH=$(uname -m | sed 's/arm64/aarch64/')
      URL="https://github.com/docker/compose/releases/download/$COMPOSE_VER/docker-compose-$OS-$ARCH"

      echo "Downloading: $URL"
      curl -L --fail --silent $URL -o .local/bin/docker-compose
      chmod +x .local/bin/docker-compose

    # 2. Login (Uses your Mac's native Docker config automatically)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

  script:
    # 3. Build & Push using the local binary
    - export IMAGE_NAME=$IMAGE_NAME
    - export IMAGE_TAG=$IMAGE_TAG

    - .local/bin/docker-compose build
    - .local/bin/docker-compose push

  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
