stages:
  - check
  - build

# ---------------------------------------------------------------------------
# Stage 1: Sanity Check (Unchanged)
# ---------------------------------------------------------------------------
lint_code:
  stage: check
  script:
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install ruff
    - ruff check --ignore F401,F841,E722 .

# ---------------------------------------------------------------------------
# Stage 2: Build and Push with Docker Compose
# ---------------------------------------------------------------------------
build_push_docker:
  stage: build
  # Docker 24+ includes the 'docker compose' plugin natively
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    # We define the base name for the image here
    IMAGE_NAME: $CI_REGISTRY_IMAGE
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  before_script:
    - mkdir -p $CI_PROJECT_DIR/.docker-ci
    - export DOCKER_CONFIG=$CI_PROJECT_DIR/.docker-ci
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "Building with Docker Compose..."
    # 1. We export the variables so docker-compose.yml can use them
    - export IMAGE_NAME=$IMAGE_NAME
    - export IMAGE_TAG=$IMAGE_TAG
    
    # 2. Build the services defined in your yaml
    - docker compose build
    
    # 3. Push the images defined in your yaml
    - docker compose push
    
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"