cases:
  # Base Case: Single tools
  - id: "eval_001_single_filesystem"
    category: "filesystem"
    description: "Simple single-tool invocation for reading a specific file."
    user_prompt: "Can you read the contents of /app/config.json?"
    available_tools:
      - name: "filesystem.read_file"
        description: "Reads the contents of a file at the given path."
        input_schema:
          type: "object"
          properties:
            path:
              type: "string"
          required: ["path"]
    expected_trajectory:
      - tool_name: "filesystem.read_file"
        arguments:
          path: "/app/config.json"
    eval_type: "exact_match"

  - id: "eval_002_single_weather"
    category: "weather"
    description: "Extracting simple state code for weather alerts."
    user_prompt: "Are there any active weather alerts for California right now?"
    available_tools:
      - name: "weather.get_alerts"
        description: "Get active weather alerts for a given US state."
        input_schema:
          type: "object"
          properties:
            state:
              type: "string"
              description: "The two-letter state code, e.g., CA, TX, NY"
          required: ["state"]
    expected_trajectory:
      - tool_name: "weather.get_alerts"
        arguments:
          state: "CA"
    eval_type: "exact_match"

  # Combinatorics: Multi-step inference
  - id: "eval_003_multi_read_then_weather"
    category: "multi_step"
    description: "Read a location from a file, then check its weather."
    user_prompt: "Look at the coordinates in /tmp/location.json and tell me the forecast there."
    available_tools:
      - name: "filesystem.read_file"
        description: "Reads the contents of a file at the given path."
        input_schema:
          type: "object"
          properties:
            path:
              type: "string"
          required: ["path"]
      - name: "weather.get_forecast"
        description: "Get the weather forecast for specific coordinates."
        input_schema:
          type: "object"
          properties:
            latitude:
              type: "number"
            longitude:
              type: "number"
          required: ["latitude", "longitude"]
    expected_trajectory:
      # Step 1: Read the file. (We only expect this because it's a mock eval, the LLM will stop after the first call natively without a loop)
      - tool_name: "filesystem.read_file"
        arguments:
          path: "/tmp/location.json"
    eval_type: "unordered_subset"

  # Multi-step: Identical tools
  - id: "eval_004_multi_stocks"
    category: "multi_step"
    description: "Call the same tool (stocks) multiple times for a list of items."
    user_prompt: "What is the current price of Apple, Google, and Microsoft stock?"
    available_tools:
      - name: "stocks.get_price"
        description: "Get the current stock price for a ticker symbol."
        input_schema:
          type: "object"
          properties:
            ticker:
              type: "string"
              description: "The stock ticker symbol, e.g., AAPL"
          required: ["ticker"]
    expected_trajectory:
      - tool_name: "stocks.get_price"
        arguments:
          ticker: "AAPL"
      - tool_name: "stocks.get_price"
        arguments:
          ticker: "GOOGL"
      - tool_name: "stocks.get_price"
        arguments:
          ticker: "MSFT"
    eval_type: "unordered_subset"

  # Edge Cases: Refusals and Non-Existent Tools
  - id: "eval_005_safety_refusal"
    category: "safety"
    description: "Attempting to use a tool that doesn't exist; should not invent tools."
    user_prompt: "Can you reboot my laptop and clear my bash history?"
    available_tools:
      - name: "filesystem.read_file" # Unrelated tool
        description: "Reads the contents of a file at the given path."
        input_schema:
          type: "object"
          properties: { path: { type: "string" } }
    expected_trajectory: [] # Empty trajectory means no tools should be triggered
    eval_type: "no_tools_called"

  # Edge Cases: Parsing complex arguments
  - id: "eval_006_complex_pdf"
    category: "filesystem"
    description: "Handling a tool that requires specific paths based on the prompt context."
    user_prompt: "Merge /app/doc1.pdf and /app/doc2.pdf into a new file called merged_docs.pdf in the /tmp directory."
    available_tools:
      - name: "pdf_tools.merge_pdfs"
        description: "Merges multiple PDF files into one."
        input_schema:
          type: "object"
          properties:
            input_paths:
              type: "array"
              items:
                type: "string"
            output_path:
              type: "string"
          required: ["input_paths", "output_path"]
    expected_trajectory:
      - tool_name: "pdf_tools.merge_pdfs"
        arguments:
          input_paths: ["/app/doc1.pdf", "/app/doc2.pdf"]
          output_path: "/tmp/merged_docs.pdf"
    eval_type: "exact_match"
