[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "theblankosl"
version = "0.1.0"
description = "TheBlankOSL MCP servers and CLI client"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Direct dependencies
    "aiofiles==24.1.0",
    "aiosqlite==0.21.0",
    "anyio==4.12.1",
    "google-api-python-client==2.185.0",
    "httpx==0.28.1",
    "mcp==1.26.0",
    "pillow==12.0.0",
    "pyautogui==0.9.54; sys_platform == 'darwin'",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "typer[all]==0.21.1",
    "pyyaml==6.0.3",
    "rich==14.3.1",
    # Transitive dependencies (pinned for reproducibility)
    "annotated-types==0.7.0",
    "attrs==25.4.0",
    "cachetools==6.2.1",
    "certifi==2025.10.5",
    "charset-normalizer==3.4.4",
    "click==8.3.0",
    "google-api-core==2.28.1",
    "google-auth==2.42.1",
    "google-auth-httplib2==0.2.0",
    "googleapis-common-protos==1.71.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httplib2==0.31.0",
    "httpx-sse==0.4.3",
    "idna==3.11",
    "jsonschema==4.25.1",
    "jsonschema-specifications==2025.9.1",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "mouseinfo==0.1.3; sys_platform == 'darwin'",
    "proto-plus==1.26.1",
    "protobuf==6.33.0",
    "pyasn1==0.6.1",
    "pyasn1-modules==0.4.2",
    "pydantic==2.12.3",
    "pydantic-core==2.41.4",
    "pydantic-settings==2.11.0",
    "pygetwindow==0.0.9; sys_platform == 'darwin'",
    "pygments==2.19.2",
    "pymsgbox==2.0.1",
    "pyobjc-core==12.1; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa==12.1; sys_platform == 'darwin'",
    "pyobjc-framework-quartz==12.1; sys_platform == 'darwin'",
    "pyparsing==3.2.5",
    "pyperclip==1.11.0",
    "pyrect==0.2.0; sys_platform == 'darwin'",
    "pyscreeze==1.0.1; sys_platform == 'darwin'",
    "python-multipart==0.0.20",
    "pytweening==1.2.0; sys_platform == 'darwin'",
    "referencing==0.37.0",
    "rpds-py==0.28.0",
    "rsa==4.9.1",
    "rubicon-objc==0.5.3; sys_platform == 'darwin'",
    "shellingham==1.5.4",
    "sniffio==1.3.1",
    "sse-starlette==3.0.3",
    "starlette==0.49.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "uritemplate==4.2.0",
    "urllib3==2.5.0",
    "uvicorn==0.38.0",
]

[project.scripts]
blankosl_cli = "mcp_client.main:app"

[tool.hatch.build.targets.wheel]
packages = ["mcp_client"]
